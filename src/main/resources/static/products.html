<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Coffee - Quản Lý Sản Phẩm</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; margin: 0; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #1e293b; }
        .form-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-row input, .form-row select { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; flex: 1; min-width: 140px; }
        .form-row button { padding: 10px 20px; background-color: #ea580c; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; }
        .btn-delete { padding: 6px 12px; background-color: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; display: none; }
        .alert-danger { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .alert-success { background-color: #dcfce7; color: #166534; border: 1px solid #4ade80; }
    </style>
</head>
<body>
    <div class="container">
        <h2>☕ Quản Lý Danh Sách Sản Phẩm Poly Coffee</h2>
        <div id="error-message" class="alert alert-danger"></div>
        <div id="success-message" class="alert alert-success"></div>

        <form id="product-form" onsubmit="handleAddProduct(event)">
            <div class="form-row">
                <input type="text" id="name" placeholder="Tên sản phẩm (VD: Cà phê sữa)">
                <input type="number" id="price" placeholder="Đơn giá (VNĐ)" step="1000">
                <input type="number" id="quantity" placeholder="Số lượng" min="0">
                <select id="category">
                    <option value="Coffee">Coffee</option>
                    <option value="Tea">Tea</option>
                    <option value="Freeze">Freeze</option>
                </select>
                <button type="submit" id="btn-add-product">+ Thêm Mới</button>
            </div>
        </form>

        <table id="product-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên Món</th>
                    <th>Đơn Giá</th>
                    <th>Số Lượng</th>
                    <th>Danh Mục</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <tr>
                    <td>1</td>
                    <td>Cà phê đen đá</td>
                    <td>25,000 đ</td>
                    <td>50</td>
                    <td>Coffee</td>
                    <td><button class="btn-delete" onclick="deleteRow(this)">Xóa</button></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Cà phê sữa đá</td>
                    <td>29,000 đ</td>
                    <td>80</td>
                    <td>Coffee</td>
                    <td><button class="btn-delete" onclick="deleteRow(this)">Xóa</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        let currentId = 3;

        function handleAddProduct(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const quantity = parseInt(document.getElementById('quantity').value);
            const category = document.getElementById('category').value;

            const errBox = document.getElementById('error-message');
            const successBox = document.getElementById('success-message');
            errBox.style.display = 'none';
            successBox.style.display = 'none';

            if (!name) {
                errBox.innerText = 'Tên sản phẩm không được để trống!';
                errBox.style.display = 'block';
                return;
            }
            if (isNaN(price) || price <= 0) {
                errBox.innerText = 'Giá sản phẩm phải lớn hơn 0!';
                errBox.style.display = 'block';
                return;
            }
            if (isNaN(quantity) || quantity < 0) {
                errBox.innerText = 'Số lượng không được âm!';
                errBox.style.display = 'block';
                return;
            }

            const tbody = document.getElementById('product-list');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${currentId++}</td>
                <td>${name}</td>
                <td>${price.toLocaleString()} đ</td>
                <td>${quantity}</td>
                <td>${category}</td>
                <td><button class="btn-delete" onclick="deleteRow(this)">Xóa</button></td>
            `;
            tbody.appendChild(tr);

            successBox.innerText = 'Thêm sản phẩm thành công!';
            successBox.style.display = 'block';
            document.getElementById('product-form').reset();
        }

        function deleteRow(btn) {
            const row = btn.closest('tr');
            row.remove();
        }
    </script>
</body>
</html>
